<!DOCTYPE html>
<html>
  <head>
	  <meta charset="UTF-8">
	  <title>Cubix Console</title>
	  <style>
      #console {
			word-wrap: break-word;
			background: #777777aa;
			margin: 0px;
			color: white;
			position: absolute;
			bottom: -100px;
			left: 0px;
		  }
		  #consoleBox {
			background: #777777aa;
			color: white;
			width: 100%;
			height: 98%;
			overflow-x: hidden;
			overflow-y: auto;
		  }
		  #consoleInput {
			border-style: hidden;
			background: #777777;
			color: white;
			width: 96%;
			height: 16px;
		  }
      select, input {
			border: 1px solid #444444;
			background: #777777;
			color: white;
		  }
    </style>
  </head>
  <body>
    <div id="console">
			<div id="consoleBox"></div>
			<input id="consoleInput"/>
			<input type="button" id="consoleButton" value="Run"/>
		</div>
  </body>
  <script>
    
  </script>
</html>
